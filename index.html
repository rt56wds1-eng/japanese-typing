<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="theme-color" content="#17162a"><title>日文滑動練習</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none;background:#17162a;color:#f2efff;font-family:-apple-system,BlinkMacSystemFont,system-ui,sans-serif}button,select,input{font:inherit;color:inherit}button,select{border:1px solid #57516c;border-radius:10px;background:#2a263d}button{cursor:pointer; -webkit-tap-highlight-color:transparent}#app{height:100%;height:100dvh;max-width:540px;margin:auto;display:flex;flex-direction:column;padding:max(10px,env(safe-area-inset-top)) 10px max(8px,env(safe-area-inset-bottom));gap:7px;overflow:hidden}.head{display:flex;align-items:center;justify-content:space-between;gap:8px}.head strong{font-size:17px}.head button{padding:6px 10px;font-size:12px}select{padding:8px;width:100%;font-size:15px}option{background:#29253d}.stats{display:flex;justify-content:space-around;text-align:center}.stats b{display:block;font-size:21px}.stats small,.muted{color:#b6afc9;font-size:11px}.target{min-height:90px;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;overflow:hidden}.q{font-size:clamp(28px,8vw,45px);font-weight:700;line-height:1.22;overflow-wrap:anywhere}.q .correct{color:#70dfaf}.q .current{border-bottom:3px solid #a79bff}.r{font-size:17px;color:#e2dcff;min-height:20px}.hint{font-size:13px;color:#bdb0ff;min-height:17px}.feedback{font-size:12px;min-height:16px;color:#c4bdd7}.tools,.footer{display:flex;align-items:center;justify-content:space-between;gap:6px;font-size:12px}.tools label{display:flex;align-items:center;gap:2px;white-space:nowrap}.tools input{accent-color:#a89af6}.tools button,.footer button{padding:6px 8px;font-size:12px}.pad{flex:none;height:min(44dvh,350px);min-height:176px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(4,minmax(0,1fr));gap:5px;touch-action:none!important;overscroll-behavior:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}.key{position:relative;min-height:0;touch-action:none!important;padding:0;overflow:hidden;background:#302c45;box-shadow:0 2px 0 #080711}.key.active{background:#6556a4}.key.suggest{border:2px solid #b1a1ff}.key .idx{position:absolute;left:5px;top:3px;font-size:10px;color:#b6afc9}.glyph{position:absolute;display:flex;flex-direction:column;align-items:center;line-height:1;pointer-events:none;font-size:clamp(12px,3.8vw,16px)}.glyph small{font-size:9px;color:#c9c2dc;margin-top:1px}.center{left:50%;top:50%;transform:translate(-50%,-50%);font-size:clamp(19px,6vw,26px);font-weight:700}.left{left:6%;top:50%;transform:translateY(-50%)}.right{right:6%;top:50%;transform:translateY(-50%)}.up{top:3px;left:50%;transform:translateX(-50%)}.down{bottom:3px;left:50%;transform:translateX(-50%)}.special{display:flex;align-items:center;justify-content:center;flex-direction:column;font-size:20px}.special small{font-size:10px;color:#b6afc9}.preview{height:17px;text-align:center;font-size:12px;color:#bdb0ff}.overlay{position:fixed;inset:0;background:#0009;display:flex;align-items:center;justify-content:center;padding:20px;z-index:10}.sheet{background:#27233a;border:1px solid #57516c;border-radius:16px;padding:18px;max-width:420px;width:100%;max-height:85dvh;overflow:auto;overscroll-behavior:contain}.sheet h2{font-size:18px;margin:0 0 12px}.sheet button{padding:10px;width:100%;margin-top:10px}.sheet p{font-size:14px;line-height:1.6}.sheet .errorrow{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #514964}.nativebox{padding:8px;border:1px solid #57516c;border-radius:10px}.nativebox input{width:100%;padding:8px;background:#29253d;border:1px solid #57516c;border-radius:8px}.nativebox button{width:100%;padding:8px;margin-top:5px} [hidden]{display:none!important}@media(max-height:570px){#app{gap:3px}.pad{height:40dvh;min-height:152px}.stats b{font-size:16px}.target{min-height:65px}.q{font-size:25px}.glyph small{display:none}.head strong{font-size:14px}.r{font-size:14px;min-height:16px}.hint,.feedback{font-size:11px;min-height:13px}.tools button,.footer button{padding:4px}.preview{height:14px}}
</style></head><body><main id="app"><div class="head"><strong>かな・日文滑動練習</strong><button id="info">說明 / 紀錄</button></div><select id="deck"><option value="basic">01｜基本平假名・46 字隨機</option><option value="rows">02｜指定數字鍵</option><option value="seq">03｜五十音順序</option><option value="dir">04｜指定滑動方向</option><option value="voiced">05｜濁音、半濁音</option><option value="combo">06｜拗音</option><option value="small">07｜小字與促音</option><option value="kata">08｜基本片假名</option><option value="words">09｜生活單字</option><option value="travel">10｜旅遊日文</option><option value="weak">11｜錯誤字詞加強</option></select><select id="sub" hidden></select><div class="stats"><div><b id="count">0</b><small>完成題數</small></div><div><b id="acc">—</b><small>正確率</small></div><div><b id="streak">0</b><small>連續正確</small></div></div><section class="target"><div class="q" id="q">あ</div><div class="r" id="r">a</div><div class="muted" id="meaning"></div><div class="hint" id="hint">1 鍵・直接按</div><div class="feedback" id="feedback" aria-live="polite">輸入上方假名</div></section><div class="tools"><label><input id="help" type="checkbox" checked>鍵位</label><label><input id="roma" type="checkbox" checked>拼音</label><label><input id="native" type="checkbox">原生鍵盤</label><button id="speak">♪ 發音</button></div><div id="preview" class="preview">按住按鍵，向指定方向滑動</div><div class="pad" id="pad"></div><div class="nativebox" id="nativebox" hidden><input id="entry" placeholder="切換日文鍵盤後輸入" autocomplete="off" autocorrect="off" spellcheck="false"><button id="check">確認答案</button></div><div class="footer"><button id="reset">重設紀錄</button><span class="muted" id="round">不限時間</span><button id="next">跳過 ›</button></div></main><div class="overlay" id="overlay" hidden><div class="sheet"><h2>練習說明與弱點紀錄</h2><p>數字為學習用鍵位編號。直接按＝a、左＝i、上＝u、右＝e、下＝o。や、わ行為例外。小゛゜鍵會循環切換對應假名；例如 は → ば → ぱ。片假名模式的模擬鍵盤直接輸出片假名。</p><div id="errlist"></div><p class="muted" id="saveinfo"></p><button id="close">返回練習</button></div></div><script>
(()=>{const $=id=>document.getElementById(id);const rows=[['あ','い','う','え','お'],['か','き','く','け','こ'],['さ','し','す','せ','そ'],['た','ち','つ','て','と'],['な','に','ぬ','ね','の'],['は','ひ','ふ','へ','ほ'],['ま','み','む','め','も'],['や','','ゆ','','よ'],['ら','り','る','れ','ろ'],['わ','を','ん','ー','']];const rs=['a i u e o','ka ki ku ke ko','sa shi su se so','ta chi tsu te to','na ni nu ne no','ha hi fu he ho','ma mi mu me mo','ya yu yo','ra ri ru re ro','wa wo n'];const dirs=['直接按','← 左滑','↑ 上滑','→ 右滑','↓ 下滑'];const basic=[],pos={},rom={},base={},cycles={},voiced=[],combo=[],small=[];const kat=s=>s.replace(/[\u3041-\u3096]/g,c=>String.fromCharCode(c.charCodeAt(0)+96)),hira=s=>s.replace(/[\u30a1-\u30f6]/g,c=>String.fromCharCode(c.charCodeAt(0)-96));rows.forEach((row,i)=>{let j=0;row.forEach((c,d)=>{if(!c)return;pos[c]=[i,d];if(c==='ー'){rom[c]='長音';return}rom[c]=rs[i].split(' ')[j++];basic.push({k:c,r:rom[c]})})});function add(a,b,r,arr){base[b]=a;rom[b]=r;(cycles[a]??=[a]).push(b);arr.push({k:b,r})} [['かきくけこ','がぎぐげご','ga gi gu ge go'],['さしすせそ','ざじずぜぞ','za ji zu ze zo'],['たちつてと','だぢづでど','da ji zu de do'],['はひふへほ','ばびぶべぼ','ba bi bu be bo'],['はひふへほ','ぱぴぷぺぽ','pa pi pu pe po']].forEach(([a,b,r])=>[...b].forEach((c,i)=>add(a[i],c,r.split(' ')[i],voiced)));[...'ぁぃぅぇぉっゃゅょ'].forEach((c,i)=>{let a='あいうえおつやゆよ'[i];add(a,c,rom[a]+'（小字）',small)});[['き','ky'],['ぎ','gy'],['し','sh'],['じ','j'],['ち','ch'],['に','ny'],['ひ','hy'],['び','by'],['ぴ','py'],['み','my'],['り','ry']].forEach(([k,r])=>['ゃ','ゅ','ょ'].forEach((c,i)=>combo.push({k:k+c,r:r+['a','u','o'][i]})));const words=[['ねこ','neko','貓'],['いぬ','inu','狗'],['みず','mizu','水'],['おちゃ','ocha','茶'],['すし','sushi','壽司'],['さかな','sakana','魚'],['にく','niku','肉'],['ごはん','gohan','飯'],['たまご','tamago','蛋'],['りんご','ringo','蘋果'],['えき','eki','車站'],['でんしゃ','densha','電車'],['くるま','kuruma','汽車'],['かさ','kasa','雨傘'],['くつ','kutsu','鞋子'],['ほん','hon','書'],['うみ','umi','海'],['そら','sora','天空'],['やさい','yasai','蔬菜'],['きっぷ','kippu','車票'],['がっこう','gakkou','學校'],['くだもの','kudamono','水果'],['しお','shio','鹽'],['さとう','satou','糖'],['ともだち','tomodachi','朋友'],['かばん','kaban','包包'],['ひこうき','hikouki','飛機']].map(([k,r,m])=>({k,r,m}));const travel=[['こんにちは','konnichiwa','你好'],['ありがとう','arigatou','謝謝'],['すみません','sumimasen','不好意思'],['いくらですか','ikura desu ka','多少錢？'],['これください','kore kudasai','請給我這個'],['どこですか','doko desu ka','在哪裡？'],['おいしいです','oishii desu','很好吃'],['わかりません','wakarimasen','我不懂'],['おねがいします','onegaishimasu','麻煩您了'],['だいじょうぶです','daijoubu desu','沒問題'],['えきはどこですか','eki wa doko desu ka','車站在哪裡？'],['おかいけいおねがいします','okaikei onegaishimasu','麻煩結帳']].map(([k,r,m])=>({k,r,m}));let stat={count:0,total:0,correct:0,streak:0,errors:{}},persistent=true;try{let old=localStorage.getItem('kana-flick-stats-v1');if(old)stat={...stat,...JSON.parse(old)};localStorage.setItem('kana-flick-stats-v1',JSON.stringify(stat))}catch(e){persistent=false}function save(){try{localStorage.setItem('kana-flick-stats-v1',JSON.stringify(stat))}catch(e){persistent=false}}let q,index=0,pending=null,queue=[],round=0,done=0,finished=false,serial=0;function source(){switch($('deck').value){case'rows':return basic.filter(x=>pos[x.k][0]===+$('sub').value);case'dir':return basic.filter(x=>pos[x.k][1]===+$('sub').value);case'voiced':return voiced;case'combo':return combo;case'small':return small;case'kata':return basic.map(x=>({...x,k:kat(x.k)}));case'words':return words;case'travel':return travel;case'weak':return Object.keys(stat.errors).map(k=>({k,r:rom[hira(k)]||''}));default:return basic}}function refill(){let a=source().slice();if(!a.length)a=basic.slice();if($('deck').value!=='seq')for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}queue=a;round=a.length;done=0}function expected(){return [...q.k][index]||''}function next(){serial++;if(!queue.length)refill();q=queue.shift();index=0;pending=null;finished=false;$('entry').value='';$('feedback').textContent='輸入上方假名';render()}function render(){let e=hira(expected()),p=pos[base[e]||e];$('q').replaceChildren();[...q.k].forEach((c,i)=>{let s=document.createElement('span');s.textContent=c;s.className=i<index?'correct':i===index?'current':'';$('q').append(s)});$('r').textContent=$('roma').checked?q.r:'';$('meaning').textContent=q.m||'';$('hint').textContent=!$('help').checked||!p?'':pending?`目前 ${pending.c}，按小゛゜變換`:`${(p[0]+1)%10} 鍵・${dirs[p[1]]}${base[e]?'，再按小゛゜':''}`;$('count').textContent=stat.count;$('acc').textContent=stat.total?Math.round(stat.correct/stat.total*100)+'%':'—';$('streak').textContent=stat.streak;$('round').textContent=`本輪 ${done}/${round}・不限時`;document.querySelectorAll('.key[data-row]').forEach(b=>b.classList.toggle('suggest',!!($('help').checked&&p&&!pending&&+b.dataset.row===p[0])));save()}function accept(n=1){stat.total+=n;stat.correct+=n;stat.streak+=n;index+=n;pending=null;$('feedback').textContent='✓ 正確';if(index>=[...q.k].length){stat.count++;done++;finished=true;$('feedback').textContent='✓ 完成';let s=serial;setTimeout(()=>{if(s===serial)next()},300)}render()}function fail(c){stat.total++;stat.streak=0;let e=expected();if(e)stat.errors[e]=(stat.errors[e]||0)+1;pending=null;$('feedback').textContent=`輸入 ${c}，再試一次`;render()}function enter(c){if(!c||finished)return;c=hira(c);let e=hira(expected());if(c===e){accept();return}if(base[e]===c){pending={b:c,c};$('feedback').textContent='請按小゛゜變換';render();return}fail(c)}function mod(){if(finished)return;if(!pending){$('feedback').textContent='先輸入原本的假名';return}let a=cycles[pending.b];if(!a)return;pending.c=a[(a.indexOf(pending.c)+1)%a.length];if(pending.c===hira(expected()))accept();else{$('feedback').textContent='目前 '+pending.c+'，繼續變換';render()}}const pad=$('pad');let touch=null;function direction(x,y){let dx=x-touch.x,dy=y-touch.y;if(Math.max(Math.abs(dx),Math.abs(dy))<12)return 0;return Math.abs(dx)>Math.abs(dy)?dx<0?1:3:dy<0?2:4}function start(key,x,y,id){if(!key||touch)return;touch={key,x,y,id};key.classList.add('active')}function move(x,y){if(!touch)return;let r=touch.key.dataset.row;if(r!==undefined){let d=direction(x,y);$('preview').textContent=(rows[+r][d]||'—')+'　'+dirs[d]}}function end(x,y,cancel){if(!touch)return;let t=touch,d=direction(x,y);touch=null;t.key.classList.remove('active');if(cancel)return;let r=t.key.dataset.row;if(r!==undefined){let c=rows[+r][d];$('preview').textContent=(c||'—')+'　'+dirs[d];enter(c)}else if(t.key.dataset.special==='mod')mod();else{pending=null;render()}}function block(e){if(e.cancelable)e.preventDefault();e.stopPropagation()}pad.addEventListener('touchstart',e=>{block(e);let t=e.changedTouches[0];start(e.target.closest('.key'),t.clientX,t.clientY,t.identifier)},{passive:false});pad.addEventListener('touchmove',e=>{block(e);let t=[...e.changedTouches].find(t=>t.identifier===touch?.id);if(t)move(t.clientX,t.clientY)},{passive:false});pad.addEventListener('touchend',e=>{block(e);let t=[...e.changedTouches].find(t=>t.identifier===touch?.id);if(t)end(t.clientX,t.clientY,false)},{passive:false});pad.addEventListener('touchcancel',e=>{block(e);end(0,0,true)},{passive:false});pad.addEventListener('pointerdown',e=>{if(e.pointerType==='touch')return;block(e);start(e.target.closest('.key'),e.clientX,e.clientY,e.pointerId);if(touch)pad.setPointerCapture(e.pointerId)});pad.addEventListener('pointermove',e=>{if(e.pointerType!=='touch'&&touch)move(e.clientX,e.clientY)});pad.addEventListener('pointerup',e=>{if(e.pointerType!=='touch'&&touch)end(e.clientX,e.clientY,false)});pad.addEventListener('pointercancel',e=>{if(e.pointerType!=='touch')end(0,0,true)});pad.addEventListener('contextmenu',block);function draw(){pad.replaceChildren();let isKata=$('deck').value==='kata';[0,1,2,3,4,5,6,7,8,'mod',9,'cancel'].forEach(i=>{let b=document.createElement('button');b.className='key';if(typeof i==='string'){b.classList.add('special');b.dataset.special=i;b.innerHTML=i==='mod'?'小゛゜<small>變換</small>':'⌫<small>取消變換</small>'}else{b.dataset.row=i;b.innerHTML=`<span class="idx">${(i+1)%10}</span>`;rows[i].forEach((c,d)=>{if(!c)return;let g=document.createElement('span');g.className='glyph '+['center','left','up','right','down'][d];g.innerHTML=(isKata?kat(c):c)+'<small>'+rom[c]+'</small>';b.append(g)})}pad.append(b)})}function restart(){queue=[];draw();next()}$('deck').onchange=()=>{let d=$('deck').value;$('sub').hidden=!['rows','dir'].includes(d);$('sub').replaceChildren();if(d==='rows'||d==='dir'){let a=d==='rows'?rows.map((r,i)=>`${(i+1)%10} 鍵｜${r[0]}行`):dirs; a.forEach((v,i)=>{let o=document.createElement('option');o.value=i;o.textContent=v;$('sub').append(o)})}restart()};$('sub').onchange=restart;$('help').onchange=render;$('roma').onchange=render;$('next').onclick=next;$('native').onchange=()=>{$('pad').hidden=$('native').checked;$('preview').hidden=$('native').checked;$('nativebox').hidden=!$('native').checked};$('check').onclick=()=>{if(finished)return;let v=$('entry').value.trim();if(!v)return;if(v===q.k){accept([...q.k].length-index)}else{fail(v)}};$('entry').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.isComposing){e.preventDefault();$('check').click()}});$('reset').onclick=()=>{if(confirm('清除所有學習紀錄？')){stat={count:0,total:0,correct:0,streak:0,errors:{}};restart()}};$('info').onclick=()=>{$('errlist').replaceChildren();let a=Object.entries(stat.errors).sort((x,y)=>y[1]-x[1]);if(!a.length)$('errlist').textContent='尚無錯誤紀錄';a.forEach(([k,n])=>{let d=document.createElement('div');d.className='errorrow';let s=document.createElement('span'),t=document.createElement('span');s.textContent=k+' '+(rom[hira(k)]||'');t.textContent=n+' 次';d.append(s,t);$('errlist').append(d)});$('saveinfo').textContent=persistent?'紀錄儲存在目前瀏覽器，清除網站資料會遺失。':'目前環境無法永久保存紀錄。';$('overlay').hidden=false};$('close').onclick=()=>{$('overlay').hidden=true};$('speak').onclick=()=>{try{let u=new SpeechSynthesisUtterance(q.k);u.lang='ja-JP';u.rate=.75;let v=speechSynthesis.getVoices().find(x=>x.lang.startsWith('ja'));if(v)u.voice=v;u.onerror=()=>{$('feedback').textContent='語音播放不可用'};speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){$('feedback').textContent='此瀏覽器不支援語音'}};restart()})();
</script></body></html>
